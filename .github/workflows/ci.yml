name: METUAV DBF 2027 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy scipy matplotlib
        pip install -r aviyonik_ve_otonom/src/edge_ai_vision/requirements.txt || true
        pip install -r aviyonik_ve_otonom/src/telemetri/requirements.txt || true

    - name: Run Complete Pytest Suite (TECS, Kalman Tracker, Telemetry, MDO, Benchmark)
      run: |
        python -m pytest

    - name: Run Full Mission SITL Autonomous Prototype
      run: |
        python aviyonik_ve_otonom/scripts/full_mission_sitl_runner.py

    - name: Verify Web GCS Telemetry Server
      run: |
        python aviyonik_ve_otonom/src/telemetri/telemetri/gcs_server.py --test

    - name: Run Competitor Benchmark & Gap Analysis
      run: |
        python rakip_analizi_ve_benchmark/scripts/competitor_benchmark_matrix.py

    - name: Verify Aerodynamic Sizing and TOGW Compliance
      run: |
        python aerodinamik/scripts/polar_analysis.py

    - name: Verify Mass and CG Budget (55 lbs Limit)
      run: |
        python mekanik_ve_yapisal/scripts/mass_and_cg_calculator.py

    - name: Verify Carbon Spar Structural FEA (+3.5g Ultimate Load) & Flutter
      run: |
        python mekanik_ve_yapisal/scripts/spar_stress_fea.py
        python mekanik_ve_yapisal/scripts/flutter_and_divergence_analyzer.py

    - name: Run BEMT Propeller, Thermal & Dual-RC Battery SOH Simulations
      run: |
        python itki_ve_guc_sistemleri/scripts/bemt_propeller_optimizer.py
        python itki_ve_guc_sistemleri/scripts/motor_thermal_simulator.py
        python itki_ve_guc_sistemleri/scripts/battery_soh_estimator.py

    - name: Verify CNC Laser Cut DXF Generation
      run: |
        python uretim_ve_test/scripts/generate_wing_rib_dxf.py

    - name: Run Full 6-DOF Nonlinear Dynamics & L1 Guidance
      run: |
        python simulasyon/scripts/six_dof_flight_dynamics.py
        python aviyonik_ve_otonom/src/ucus_kontrol/src/l1_path_follower.py
        python simulasyon/scripts/simulate_flight_test.py
